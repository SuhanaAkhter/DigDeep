<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/team-stats.css"> <link rel="stylesheet" href="../../css/manage-players.css"> <title>Player Stats | Dig Deep</title>
</head>
<body>
  <div class="container-fluid px-5">
    <nav class="nav-pill-container">
      <div class="d-flex align-items-center">
        <div class="nav-item-custom"><a href="player-dashboard" class="navbar-link">dashboard</a></div>
        <div class="nav-item-custom">
          my team ▾
          <div class="dropdown-menu-custom">
            <a href="player-stats" class="dropdown-item-custom">your stats</a>
            <a href="team-stats" class="dropdown-item-custom">team stats</a>
          </div>
        </div>
        <div class="nav-item-custom"><a href="permissions" class="navbar-link">permissions</a></div>
      </div>
      <div class="d-flex align-items-center">
        <div class="nav-item-custom">
          <a href="account-settings" class="navbar-link">settings</a>
        </div>
        <span class="role-tag">player</span>
      </div>
    </nav>

    <div class="row mt-5">
      <div class="col-md-7">
        <h1 class="stats-header">ori's season stats</h1>
        
        <div class="row g-4 mt-2">
          <div class="col-md-6">
            <div class="stat-card olive">
              <p class="stat-label">kills</p>
              <div class="stat-value">4</div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="stat-card pink">
              <p class="stat-label">aces</p>
              <div class="stat-value">0</div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="stat-card pink">
              <p class="stat-label">digs</p>
              <div class="stat-value">100</div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="stat-card brown">
              <p class="stat-label">blocks</p>
              <div class="stat-value">0</div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-3 offset-md-1">
        <div class="player-detail-card">
          <h2 class="linda-title">ORI</h2>
          <div class="d-flex justify-content-between align-items-start">
              <div class="linda-info">
                  <p>player</p>
                  <p class="mt-3"><strong>positions:</strong><br>middle, left</p>
              </div>
              <div class="linda-upload-box">
                  <img src="../../assets/icons/upload_arrow.png" style="width:30px;">
              </div>
          </div>
          
          <div class="featured-game-mini mt-4">
              <p class="mb-1">best performance:</p>
              <p class="small text-uppercase" style="color: var(--pill-pink);">October 31st</p>
              <div class="stat-card olive" style="min-height: 120px; border-radius: 15px;">
                <p class="stat-label" style="font-size: 1rem;">kills</p>
                <div class="stat-value" style="font-size: 3rem;">15</div>
              </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
