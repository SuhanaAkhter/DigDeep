<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/permissions.css">
  <title>Permissions | Dig Deep</title>
</head>
<body>
  <div class="container-fluid px-5">

    <!-- ================== NAVIGATION ================== -->
    {% include 'shared/navbar.html' %}

    <!-- ================== MAIN CONTENT ================== -->
    <h1 class="permissions-title">permissions</h1>

    <div class="permissions-card">
      <div class="permission-row">
        <label class="toggle-switch">
          <input type="checkbox" id="toggleTeamStats">
          <span class="toggle-slider"></span>
        </label>
        allow players to view full team stats
      </div>
    </div>
  </div>

  <script>
    const toggle = document.getElementById('toggleTeamStats');

    // Load current setting
    fetch('/api/stats/permissions')
      .then(r => r.json())
      .then(data => { toggle.checked = data.allow_players_view_stats; })
      .catch(() => { toggle.checked = true; });

    // Save on change
    toggle.addEventListener('change', () => {
      fetch('/api/stats/permissions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ allow_players_view_stats: toggle.checked })
      });
    });
  </script>
  <script src="/js/navbar.js"></script>
</body>
</html>
