<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/game-stats.css">
  <title>Season Games | Dig Deep</title>
</head>

<body>
  <div class="container-fluid px-5">

    <!-- NAVBAR -->
    <nav class="nav-pill-container">
      <div class="d-flex align-items-center">
        <div class="nav-item-custom">
          <a href="coach-dashboard" class="navbar-link">dashboard</a>
        </div>
        <div class="nav-item-custom">
          my team ▾
          <div class="dropdown-menu-custom">
            <a href="manage-players" class="dropdown-item-custom">players</a>
            <a href="manage-games" class="dropdown-item-custom">games</a>
            <a href="team-stats" class="dropdown-item-custom">stats</a>
          </div>
        </div>
        <div class="nav-item-custom">
          <a href="permissions" class="navbar-link">permissions</a>
        </div>
      </div>
      <div class="d-flex align-items-center">
        <div class="nav-item-custom">
          <a href="account-settings" class="navbar-link">settings</a>
        </div>
        <span class="role-tag">coach</span>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="row mt-4">
      <div class="col-md-3">
        <h1 class="page-header-text">this season's<br>GAMES</h1>
        <div class="featured-sidebar mt-4">
          <h2 class="sidebar-title">featured games</h2>
          <!-- Filled dynamically -->
          <div id="featuredGamesList"></div>
        </div>
      </div>

      <div class="col-md-9">
        <!-- Games filled dynamically by game-stats.js -->
        <div class="games-grid" id="gamesGrid"></div>
      </div>
    </div>
  </div>

  <!-- ==================== ADD GAME MODAL ==================== -->
  <div id="addGameModal" class="custom-modal">
    <div class="modal-content-small">
      <div class="modal-header-custom">
        <span>add game</span>
        <button class="close-modal" id="closeAddModal">✖</button>
      </div>
      <div class="modal-body-custom">
        <h2>MHS VS.....</h2>
        <div class="d-flex align-items-center gap-2 mb-4">
          <label>opposing school:</label>
          <input type="text" id="newOpponentInput" class="lorem-input" placeholder="school name">
        </div>
        <button class="save-btn-floating" id="saveNewGameBtn">save + add stats</button>
      </div>
    </div>
  </div>

  <!-- ==================== VIEW GAME MODAL ==================== -->
  <div id="viewGameModal" class="custom-modal">
    <div class="modal-content-large">
      <div class="modal-header-custom">
        <span class="text-uppercase">MHS VS <span id="viewOpponent" class="text-pink"></span></span>
        <div class="d-flex align-items-center gap-3">
          <span id="openEditBtn" style="cursor:pointer; text-decoration:underline;">edit stats</span>
          <button class="close-modal" id="closeViewModal">✖</button>
        </div>
      </div>
      <div class="modal-body-custom row">
        <div class="col-8">
          <div class="row g-2">
            <div class="col-4"><div class="stat-mini-card olive" id="viewKills">kills<br>—</div></div>
            <div class="col-4"><div class="stat-mini-card pink" id="viewAces">aces<br>—</div></div>
            <div class="col-4"><div class="stat-mini-card brown" id="viewBlocks">blocks<br>—</div></div>
          </div>
          <div class="featured-player-tag mt-4" id="viewFeatured">featured player: —</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== EDIT GAME MODAL ==================== -->
  <div id="editGameModal" class="custom-modal">
    <div class="modal-content-large">
      <div class="modal-header-custom">
        <span class="text-uppercase">MHS VS <span id="editOpponent" class="text-pink"></span></span>
        <div class="d-flex align-items-center gap-3">
          <button class="close-modal" id="closeEditModal">✖</button>
        </div>
      </div>
      <!-- Filled dynamically by game-stats.js -->
      <div class="modal-body-custom" id="editModalBody"></div>
    </div>
  </div>

  <!-- ==================== DELETE CONFIRM MODAL ==================== -->
  <div id="deleteConfirmModal" class="custom-modal">
    <div class="modal-content-alert">
      <div class="modal-header-alert">
        <span>delete game?</span>
        <button class="close-modal-sm" id="closeDeleteModal">✖</button>
      </div>
      <div class="modal-body-alert text-center p-3">
        <p>Are you sure? This will delete all stats for this game too.</p>
        <div class="d-flex justify-content-center gap-3">
          <button class="alert-btn" id="confirmDeleteBtn">yes, delete</button>
          <button class="alert-btn" id="cancelDeleteBtn">no, go back</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/game-stats.js"></script>
</body>
</html>
