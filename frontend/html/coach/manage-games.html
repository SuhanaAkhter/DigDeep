<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/dashboard.css">
  <!-- Game box grid, modal styles, context menu, stat mini-cards -->
  <link rel="stylesheet" href="/css/game-stats.css">
  <title>Season Games | Dig Deep</title>
</head>

<body>
  <div class="container-fluid px-5">

    {% include 'shared/navbar.html' %}

    <!-- ── MANAGE GAMES PAGE ──────────────────────────────────────────────
         Left  (col-md-3): page title + featured games sidebar
         Right (col-md-9): game box grid

         All game data is fetched and rendered by game-stats.js.
         Games grid: GET /api/games/
         Each tile shows the summed set score by default.
         Right-clicking a tile opens the context menu (view / edit / delete).
    ─────────────────────────────────────────────────────────────────────── -->
    <div class="row mt-4">

      <!-- Left: title + featured sidebar -->
      <div class="col-md-3">
        <h1 class="page-header-text">this season's<br>GAMES</h1>
        <div class="featured-sidebar mt-4">
          <h2 class="sidebar-title">featured games</h2>
          <!-- Cards injected by renderFeaturedSidebar() in game-stats.js
               Score fetched from GET /api/stats/game/<id>/sets and summed -->
          <div id="featuredGamesList"></div>
        </div>
      </div>

      <!-- Right: game tile grid (rendered by game-stats.js → renderGames()) -->
      <div class="col-md-9">
        <div class="games-grid" id="gamesGrid"></div>
      </div>

    </div>
  </div>

  <!-- ── ADD GAME MODAL ─────────────────────────────────────────────────────
       Opened by clicking the '+' tile in the game grid.
       Live preview updates the "MHS VS ..." heading as the coach types.
       On save: POST /api/games/ then immediately opens the edit modal
       so the coach can enter stats right away.
  ──────────────────────────────────────────────────────────────────────────── -->
  <div id="addGameModal" class="custom-modal">
    <div class="modal-content-small">
      <div class="modal-header-custom">
        <span>add game</span>
        <button class="close-modal" id="closeAddModal">✖</button>
      </div>
      <div class="modal-body-custom">
        <!-- Live preview of the game title as the coach types -->
        <h2 class="add-game-preview">MHS VS <span id="opponentPreview">.....</span></h2>
        <div class="d-flex align-items-center gap-2 mb-4">
          <label>opposing school:</label>
          <input type="text" id="newOpponentInput" class="lorem-input" placeholder="school name">
        </div>
        <button class="save-btn-floating" id="saveNewGameBtn">save + add stats</button>
      </div>
    </div>
  </div>

  <!-- ── VIEW GAME MODAL ────────────────────────────────────────────────────
       Opened by left-clicking a game tile or choosing "view stats" in the
       context menu. Shows:
         Left  (col-4 #setSidebar): clickable set score boxes (loaded from DB)
         Right (col-8):             kills/aces/blocks totals + featured player
       "edit stats" link opens the edit modal for the same game.
  ──────────────────────────────────────────────────────────────────────────── -->
  <div id="viewGameModal" class="custom-modal">
    <div class="modal-content-large">
      <div class="modal-header-custom">
        <span class="text-uppercase">MHS VS <span id="viewOpponent" class="text-pink"></span></span>
        <div class="d-flex align-items-center gap-3">
          <span id="openEditBtn" style="cursor:pointer; text-decoration:underline;">edit stats</span>
          <button class="close-modal" id="closeViewModal">✖</button>
        </div>
      </div>
      <div class="modal-body-custom row">
        <!-- Set score boxes injected by openViewModal() in game-stats.js -->
        <div class="col-4" id="setSidebar" style="overflow-y:auto; max-height:300px;"></div>
        <!-- Aggregate stats from GET /api/stats/game/<id> -->
        <div class="col-8">
          <div class="row g-2">
            <div class="col-4"><div class="stat-mini-card olive" id="viewKills">kills<br>—</div></div>
            <div class="col-4"><div class="stat-mini-card pink"  id="viewAces">aces<br>—</div></div>
            <div class="col-4"><div class="stat-mini-card brown" id="viewBlocks">blocks<br>—</div></div>
          </div>
          <!-- Player with highest kills in this game -->
          <div class="featured-player-tag mt-4" id="viewFeatured">featured player: —</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── EDIT GAME MODAL ────────────────────────────────────────────────────
       Body is fully generated by openEditModal() in game-stats.js.
       Contains:
         - Set score ▲/▼ adjusters for each set
         - Per-player stat input table (kills/assists/aces/blocks/digs)
         - "save changes" button → saveAll() which POSTs sets and stats in parallel
  ──────────────────────────────────────────────────────────────────────────── -->
  <div id="editGameModal" class="custom-modal">
    <div class="modal-content-large">
      <div class="modal-header-custom">
        <span class="text-uppercase">MHS VS <span id="editOpponent" class="text-pink"></span></span>
        <button class="close-modal" id="closeEditModal">✖</button>
      </div>
      <!-- Populated dynamically by game-stats.js -->
      <div class="modal-body-custom" id="editModalBody"></div>
    </div>
  </div>

  <!-- ── DELETE CONFIRM MODAL ───────────────────────────────────────────────
       Shown when "delete game" is chosen from the context menu.
       Confirmation sends DELETE /api/games/<id> which cascades to
       player_stats, set_scores, and heatmap_events via DB foreign keys.
  ──────────────────────────────────────────────────────────────────────────── -->
  <div id="deleteConfirmModal" class="custom-modal">
    <div class="modal-content-alert">
      <div class="modal-header-alert">
        <span>delete game?</span>
        <button class="close-modal-sm" id="closeDeleteModal">✖</button>
      </div>
      <div class="modal-body-alert text-center p-3">
        <p>are you sure? this will delete all stats for this game too.</p>
        <div class="d-flex justify-content-center gap-3">
          <button class="alert-btn" id="confirmDeleteBtn">yes, delete</button>
          <button class="alert-btn" id="cancelDeleteBtn">no, go back</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── CONTEXT MENU ───────────────────────────────────────────────────────
       Shown on right-click over a game tile.
       Positioned absolutely by game-stats.js using mouse coordinates.
       Hidden on any left-click anywhere on the page.
  ──────────────────────────────────────────────────────────────────────────── -->
  <div id="gameContextMenu" class="context-menu">
    <div class="context-item" id="ctxViewStats">view stats</div>
    <div class="context-item" id="ctxEditGame">edit game</div>
    <div class="context-item danger" id="ctxDeleteGame">delete game</div>
  </div>

  <script src="/js/navbar.js"></script>
  <!-- game-stats.js: all game grid, modal, context menu, and API logic -->
  <script src="/js/game-stats.js"></script>
</body>
</html>
