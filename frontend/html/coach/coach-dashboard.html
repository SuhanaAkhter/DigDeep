<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <title>Coach Dashboard | Dig Deep</title>
</head>
<body>
  <div class="container-fluid px-5">

    <!-- ================== NAVIGATION ================== -->
    {% include 'shared/navbar.html' %}

    <!-- ================== MAIN CONTENT ================== -->
    <div class="row">
      <div class="col-md-7">
        <div style="margin-top: 15vh;">
          <h1 style="font-size: 5rem; font-weight: 900;">hey!</h1>
          <h2 style="font-size: 2.5rem;">welcome to digdeep....</h2>
        </div>
        <div class="profile-group">
          <div class="profile-circle"></div>
          <div>
            <h3 style="font-weight: bold; margin-bottom: 0;">your name</h3>
            <p>coach</p>
          </div>
        </div>
      </div>

      <div class="col-md-4 offset-md-1">
        <div class="featured-sidebar">
          <h2 class="sidebar-title">featured games</h2>
          <a href="manage-games" style="color: inherit; text-decoration: underline;">
            <p>view all games</p>
          </a>
          
          <div class="game-card">
            <p class="game-title">MHS VS De la Salle</p>
            <div class="game-score">3-0</div>
            <p>it's a clean sweep!</p>
          </div>

          <div class="game-card">
            <p class="game-title">MHS VS LDH</p>
            <div class="game-score">31 kills</div>
            <p>someone got murdered...</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
