<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    manage-players.html
    -------------------
    Page for managing volleyball team players.
    Features:
      - Search players by name
      - Filter players by position (supports multiple positions)
      - Click a player to see detailed info
      - Add Player popup form (pink box)
      - Dynamic rendering from API endpoint /api/players/
  -->
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/manage-players.css">
  <link rel="stylesheet" href="../../css/game-stats.css">
  <title>Manage Players | Dig Deep</title>
</head>
<body>
  <div class="container-fluid px-5 mt-3">
    <!-- ================== NAVIGATION ================== -->
    {% include 'shared/navbar.html' %}

    <!-- ================== MAIN CONTENT ================== -->
    <div class="row">
      <!-- ========== PLAYERS LIST ========== -->
      <div class="col-md-8">
        <h1 class="page-header-text">players</h1>

        <!-- Search + Filter -->
        <div class="d-flex align-items-center mb-4 gap-3">
          <input type="text" id="searchInput" class="search-input" placeholder="name...">
          <div class="filter-group d-flex align-items-center gap-2">
            <span>filter by:</span>
            <label><input type="checkbox" class="position-filter" value="Right" checked> right</label>
            <label><input type="checkbox" class="position-filter" value="Left"> left</label>
            <label><input type="checkbox" class="position-filter" value="Setter"> setter</label>
            <label><input type="checkbox" class="position-filter" value="Libero"> libero</label>
            <label><input type="checkbox" class="position-filter" value="Middle"> middle</label>
            <label><input type="checkbox" class="position-filter" value="Outside"> outside</label>
            <label><input type="checkbox" class="position-filter" value="Opposite"> opposite</label>
          </div>
        </div>

        <div id="playersGrid" class="row row-cols-4 g-4"></div>
      </div>

      <!-- ========== PLAYER DETAIL ========== -->
      <div class="col-md-3 offset-md-1">
        <div id="playerDetailCard" class="player-detail-card" style="display:none;">
          <h2 id="playerName" class="linda-title"></h2>
          <div class="d-flex justify-content-between align-items-start">
            <div id="playerInfo" class="linda-info"></div>
            <div id="playerPicDisplay" class="linda-upload-box">
              <img src="../../assets/icons/upload_arrow.png" style="width:30px;">
            </div>
          </div>
          <button class="view-stats-btn mt-4" id="viewStatsBtn">view stats</button>
          <div id="playerStatsPreview" class="mt-4" style="display:none;">
            <div class="row g-2 mt-1">
              <div class="col-6">
                <div class="stat-card olive" style="min-height:80px;border-radius:12px;">
                  <p class="stat-label" style="font-size:0.8rem;">kills</p>
                  <div class="stat-value" style="font-size:2rem;" id="previewKills">—</div>
                </div>
              </div>
              <div class="col-6">
                <div class="stat-card pink" style="min-height:80px;border-radius:12px;">
                  <p class="stat-label" style="font-size:0.8rem;">aces</p>
                  <div class="stat-value" style="font-size:2rem;" id="previewAces">—</div>
                </div>
              </div>
              <div class="col-6">
                <div class="stat-card brown" style="min-height:80px;border-radius:12px;">
                  <p class="stat-label" style="font-size:0.8rem;">blocks</p>
                  <div class="stat-value" style="font-size:2rem;" id="previewBlocks">—</div>
                </div>
              </div>
              <div class="col-6">
                <div class="stat-card olive" style="min-height:80px;border-radius:12px;">
                  <p class="stat-label" style="font-size:0.8rem;">digs</p>
                  <div class="stat-value" style="font-size:2rem;" id="previewDigs">—</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ADD PLAYER MODAL -->
  <div id="addPlayerModal" class="custom-modal">
    <div class="modal-content-small">
      <div class="modal-header-custom">
        <span>add player</span>
        <button class="close-modal" id="closeAddPlayer">✖</button>
      </div>
      <div class="modal-body-custom" style="padding:20px;">
        <div class="d-flex flex-column gap-3">
          <div>
            <label style="font-weight:bold;color:var(--text-brown);font-size:0.9rem;">name</label>
            <input type="text" id="newPlayerName" class="lorem-input w-100 mt-1" placeholder="player name">
          </div>
          <div>
            <label style="font-weight:bold;color:var(--text-brown);font-size:0.9rem;">grade</label>
            <input type="text" id="newPlayerGrade" class="lorem-input w-100 mt-1" placeholder="e.g. 11">
          </div>
          <div>
            <label style="font-weight:bold;color:var(--text-brown);font-size:0.9rem;">position</label>
            <input type="text" id="newPlayerPosition" class="lorem-input w-100 mt-1" placeholder="e.g. Middle, Setter">
          </div>
          <div>
            <label style="font-weight:bold;color:var(--text-brown);font-size:0.9rem;">jersey #</label>
            <input type="number" id="newPlayerJersey" class="lorem-input w-100 mt-1" placeholder="e.g. 7">
          </div>
          <p id="addPlayerError" style="color:#a05050;font-size:0.85rem;min-height:18px;"></p>
          <button id="saveAddPlayer" class="save-btn-floating" style="position:static;margin-top:4px;">add player</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/player.js"></script>
</body>
</html>
