<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigDeep | Sign Up</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>

  <!-- ── SIGN UP PAGE ───────────────────────────────────────────────────────
       Two-column layout matching the login page.
       Form posts to POST /api/auth/signup via auth.js.
       Role selection (player/coach) determines which dashboard the user
       is redirected to after successful signup.
  ──────────────────────────────────────────────────────────────────────────── -->
  <main class="container-fluid min-vh-100 d-flex align-items-center">
    <div class="row w-100 justify-content-center align-items-center">

      <!-- Left: signup form -->
      <div class="col-md-5 offset-md-1">
        <h1 class="page-title">sign up</h1>

        <!-- id="signupForm" is the hook auth.js listens to -->
        <form id="signupForm" class="custom-form">

          <!-- Name is stored on the players table for player accounts -->
          <div class="mb-3">
            <input type="text" class="form-control custom-input pink"
                   id="name" placeholder="name">
          </div>

          <div class="mb-3">
            <input type="email" class="form-control custom-input pink"
                   id="email" placeholder="email">
          </div>

          <!-- Role dropdown: determines DB table written to and redirect target -->
          <div class="mb-3">
            <select class="form-select custom-input olive" id="role" required>
              <option value="" selected disabled>role</option>
              <option value="player">player</option>
              <option value="coach">coach</option>
            </select>
          </div>

          <div class="mb-3 d-flex align-items-center">
            <!-- Olive input = password field styling from login.css -->
            <input type="password" class="form-control custom-input olive"
                   id="password" placeholder="password">
            <button type="submit" class="submit-arrow-btn">
              <img src="/assets/icons/arrow_icon.png" alt="submit" class="submit-arrow">
            </button>
          </div>

        </form>
      </div>

      <!-- Right: decorative logo -->
      <div class="col-md-5">
        <img src="/assets/images/logo.png" alt="Dig Deep Logo" class="signup-logo">
      </div>

    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
