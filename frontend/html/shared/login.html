<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DigDeep | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <main class="container-fluid min-vh-100 d-flex align-items-center">
    <div class="row w-100 justify-content-center align-items-center">
      
      <div class="col-md-5 offset-md-1">
        <h1 class="page-title">login</h1>
        
        <form id="loginForm" class="custom-form">
          <div class="mb-3">
            <input type="email" class="form-control custom-input pink" id="email" placeholder="email">
          </div>
          <div class="mb-3 d-flex align-items-center">
            <input type="password" class="form-control custom-input pink" id="password" placeholder="password">
            <button type="submit" class="submit-arrow-btn">
              <img src="/assets/icons/arrow_icon.png" alt="submit" class="submit-arrow">
            </button>
          </div>
          <div class="mb-1">
            <a href="/reset-password" class="forgot-link">forgot your password?</a>
          </div>
        </form>
      </div>

      <div class="col-md-5">
        <img src="/assets/images/logo.png" alt="Dig Deep Logo" class="signup-logo">
      </div>
    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
