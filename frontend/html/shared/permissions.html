<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Permissions | Dig Deep</title>
  <link rel="stylesheet" href="../../css/permissions.css">
</head>
<body>

  <div class="container">

    <!-- Top Bar -->
    <div class="top-bar">
      <div class="left-tabs">
        <button class="tab">my team ▼</button>
        <button class="tab active">permissions</button>
      </div>
      <div class="right-tabs">
        <button class="tab"><a href="../shared/account-settings.html">settings</a></button>
        <span class="coach">coach</span>
        <button class="close-btn">✕</button>
      </div>
    </div>

    <!-- Title -->
    <h1 class="title">permissions</h1>

    <!-- Card -->
    <div class="card">

      <!-- Toggle 1 -->
      <div class="toggle-row">
        <label class="switch">
          <input type="checkbox">
          <span class="slider"></span>
        </label>
        <span class="label-text">allow players to view full team stats</span>
      </div>

      <!-- Toggle 2 -->
      <div class="toggle-row">
        <label class="switch">
          <input type="checkbox" checked>
          <span class="slider"></span>
        </label>
        <span class="label-text">allow players to view their own stats</span>
      </div>

    </div>
  </div>

</body>
</html>
