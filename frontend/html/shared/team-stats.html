<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/team-stats.css">
  <title>Team Stats | Dig Deep</title>
</head>
<body>
  <div class="container-fluid px-5">
    <!-- Navbar -->
    <nav class="nav-pill-container">
      <div class="d-flex align-items-center">
        <div class="nav-item-custom"><a href="permissions" class="navbar-link">permissions</a></div>
      </div>
      <div class="d-flex align-items-center">
        <div class="nav-item-custom">
          <a href="account-settings" class="navbar-link">settings</a>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="row mt-5">
      <!-- Stats Cards -->
      <div class="col-md-7">
        <h1 class="stats-header">team season stats</h1>
        <div class="row g-4 mt-2">
          <div class="col-md-4">
            <div class="stat-card olive">
              <p class="stat-label">kills</p>
              <div class="stat-value">-</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="stat-card pink">
              <p class="stat-label">aces</p>
              <div class="stat-value">-</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="stat-card brown">
              <p class="stat-label">blocks</p>
              <div class="stat-value">-</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="stat-card olive">
              <p class="stat-label">kill ratio %</p>
              <div class="stat-value">-</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="stat-card pink">
              <p class="stat-label">serve ratio %</p>
              <div class="stat-value">-</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="stat-card brown">
              <p class="stat-label">digs</p>
              <div class="stat-value">-</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Featured Games Sidebar -->
      <div class="col-md-4 offset-md-1">
        <div class="featured-sidebar">
          <h2 class="sidebar-title">featured games</h2>
          <p>view all games</p>
          <div class="game-card">
            <p class="game-title">MHS VS De la Salle</p>
            <div class="game-score">3-0</div>
            <p>it's a clean sweep!</p>
          </div>
          <div class="game-card">
            <p class="game-title">MHS VS LDH</p>
            <div class="game-score">31 kills</div>
            <p>someone got murdered...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="/js/team-stats.js"></script>
</body>
</html>
