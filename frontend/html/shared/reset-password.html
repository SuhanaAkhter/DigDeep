<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigDeep | Reset Password</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css?v=2">
</head>
<body>

  <!-- ── PASSWORD RESET FLOW ────────────────────────────────────────────────
       Four-step process managed entirely by reset-password.js:
         Step 1 — User enters their email → POST /api/auth/forgot-password
                  Backend generates a 6-digit code, stores it in DB, emails it
         Step 2 — User enters the code    → POST /api/auth/verify-reset-code
         Step 3 — User sets new password  → POST /api/auth/reset-password
         Step 4 — Success confirmation with link back to login

       Only one step div is visible at a time; JS toggles display.
  ──────────────────────────────────────────────────────────────────────────── -->
  <main class="container-fluid min-vh-100 d-flex align-items-center">
    <div class="row w-100 justify-content-center align-items-center">

      <div class="col-md-5 offset-md-1">

        <!-- STEP 1: Email entry -->
        <div id="step1">
          <h1 class="page-title">forgot password</h1>
          <p class="mb-3" style="color: var(--text-brown);">enter the email you signed up with</p>
          <form id="forgotForm" class="custom-form">
            <div class="mb-3 d-flex align-items-center">
              <input type="email" class="form-control custom-input pink"
                     id="resetEmail" placeholder="email">
              <button type="submit" class="submit-arrow-btn">
                <img src="/assets/icons/arrow_icon.png" alt="submit" class="submit-arrow">
              </button>
            </div>
          </form>
        </div>

        <!-- STEP 2: 6-digit code entry (hidden until step 1 succeeds) -->
        <div id="step2" style="display:none;">
          <h1 class="page-title">check your email</h1>
          <p class="mb-3" style="color: var(--text-brown);">enter the 6-digit code we sent you</p>
          <form id="codeForm" class="custom-form">
            <div class="mb-3 d-flex align-items-center">
              <input type="text" class="form-control custom-input pink"
                     id="resetCode" placeholder="000000" maxlength="6">
              <button type="submit" class="submit-arrow-btn">
                <img src="/assets/icons/arrow_icon.png" alt="submit" class="submit-arrow">
              </button>
            </div>
          </form>
        </div>

        <!-- STEP 3: New password entry (hidden until step 2 succeeds) -->
        <div id="step3" style="display:none;">
          <h1 class="page-title">new password</h1>
          <p class="mb-3" style="color: var(--text-brown);">choose a new password</p>
          <form id="newPasswordForm" class="custom-form">
            <div class="mb-3 d-flex align-items-center">
              <input type="password" class="form-control custom-input pink"
                     id="newPassword" placeholder="new password">
              <button type="submit" class="submit-arrow-btn">
                <img src="/assets/icons/arrow_icon.png" alt="submit" class="submit-arrow">
              </button>
            </div>
          </form>
        </div>

        <!-- STEP 4: Success (hidden until step 3 succeeds) -->
        <div id="step4" style="display:none;">
          <h1 class="page-title">all done!</h1>
          <p style="color: var(--text-brown);">your password has been updated.</p>
          <a href="/login" style="color: var(--text-brown); font-weight: bold;">back to login →</a>
        </div>

      </div>

      <!-- Right: decorative logo -->
      <div class="col-md-5">
        <img src="/assets/images/logo.png" alt="Dig Deep Logo" class="signup-logo">
      </div>

    </div>
  </main>

  <!-- reset-password.js manages step transitions and all three API calls -->
  <script src="/js/reset-password.js?v=2"></script>
</body>
</html>
