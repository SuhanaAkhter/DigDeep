<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/manage-players.css">
  <title>Manage Players | Dig Deep</title>
</head>
<body>
  <div class="container-fluid px-5">
    <nav class="nav-pill-container">
        <div class="d-flex align-items-center">
          <div class="nav-item-custom">
            my team ▾
            <div class="dropdown-menu-custom">
              <a href="manage-players.html" class="dropdown-item-custom">players</a>
              <a href="team-stats.html" class="dropdown-item-custom">stats</a>
              <a href="game-stats.html" class="dropdown-item-custom">games</a>
            </div>
          </div>
          <div class="nav-item-custom"><a href="permissions.html" class="navbar-link">permissions</a></div>
        </div>
        <div class="d-flex align-items-center">
          <div class="nav-item-custom">settings</div>
          <img src="../assets/icons/close_x.png" style="width:30px; cursor:pointer;" onclick="window.location.href='coach-dashboard.html'">
        </div>
    </nav>

    <div class="row mt-4">
      <div class="col-md-8">
        <h1 class="page-header-text">players</h1>
        
        <div class="d-flex align-items-center mb-4 gap-3">
            <input type="text" class="search-input" placeholder="name...">
            
            <div class="filter-group d-flex align-items-center gap-2">
                <span>filter by:</span>
                <label><input type="checkbox" checked> right</label>
                <label><input type="checkbox"> left</label>
                <label><input type="checkbox"> setter</label>
                <label><input type="checkbox"> libero</label>
                <label><input type="checkbox"> middle</label>
            </div>
        </div>

        <div class="row row-cols-4 g-4">
            <div class="col text-center">
                <div class="player-square active-selection"></div>
                <p class="m-0 fw-bold">your name</p>
                <small>coach</small>
            </div>
            <div class="col text-center">
                <div class="player-square"></div>
                <p class="m-0 fw-bold">your name</p>
                <small>lorem</small>
            </div>
            <div class="col text-center">
                <div class="player-square"></div>
                <p class="m-0 fw-bold">your name</p>
                <small>opposite</small>
            </div>
            <div class="col text-center">
                <div class="player-square"></div>
                <p class="m-0 fw-bold">your name</p>
                <small>coach</small>
            </div>
            <div class="col text-center">
                <div class="player-square-add">
                    <img src="../assets/icons/upload_arrow.png" alt="add" style="width:40px;">
                </div>
                <p class="m-0 fw-bold">your name</p>
                <small>lorem</small>
            </div>
        </div>
      </div>

      <div class="col-md-3 offset-md-1">
        <div class="player-detail-card">
          <h2 class="linda-title">LINDA</h2>
          <div class="d-flex justify-content-between align-items-start">
              <div class="linda-info">
                  <p>player</p>
                  <p>gr. 12</p>
                  <p class="mt-3"><strong>positions:</strong><br>middle, left</p>
              </div>
              <div class="linda-upload-box">
                  <img src="../assets/icons/upload_arrow.png" style="width:30px;">
              </div>
          </div>
          
          <button class="view-stats-btn mt-4">view stats</button>

          <div class="featured-game-mini mt-4">
              <p class="mb-1">featured game:</p>
              <div class="game-tag">MHS VS LDH</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
