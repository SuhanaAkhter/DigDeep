<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    manage-players.html
    -------------------
    Page for managing volleyball team players.
    Features:
      - Search players by name
      - Filter players by position (supports multiple positions)
      - Click a player to see detailed info
      - Dynamic rendering from API endpoint /api/players/
  -->
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/manage-players.css">
  <title>Manage Players | Dig Deep</title>

  <!-- ================== NAVIGATION ================== -->
  <div class="container-fluid px-5 mt-3">
    <nav class="nav-pill-container mb-4">
      <div class="d-flex align-items-center">
        <div class="nav-item-custom">
          my team ▾
          <div class="dropdown-menu-custom">
            <a href="manage-players.html" class="dropdown-item-custom">players</a>
            <a href="team-stats.html" class="dropdown-item-custom">stats</a>
            <a href="game-stats.html" class="dropdown-item-custom">games</a>
          </div>
        </div>
        <div class="nav-item-custom"><a href="permissions.html" class="navbar-link">permissions</a></div>
      </div>
      <div class="d-flex align-items-center">
        <div class="nav-item-custom">settings</div>
        <img src="../assets/icons/close_x.png" style="width:30px; cursor:pointer;" onclick="window.location.href='coach-dashboard.html'">
      </div>
    </nav>

    <!-- ================== MAIN CONTENT ================== -->
    <div class="row">
      <!-- ========== PLAYERS LIST COLUMN ========== -->
      <div class="col-md-8">
        <h1 class="page-header-text">players</h1>

        <!-- Search + Filter -->
        <div class="d-flex align-items-center mb-4 gap-3">
          <input type="text" id="searchInput" class="search-input" placeholder="name...">

          <div class="filter-group d-flex align-items-center gap-2">
            <span>filter by:</span>
            <label><input type="checkbox" class="position-filter" value="Right" checked> right</label>
            <label><input type="checkbox" class="position-filter" value="Left"> left</label>
            <label><input type="checkbox" class="position-filter" value="Setter"> setter</label>
            <label><input type="checkbox" class="position-filter" value="Libero"> libero</label>
            <label><input type="checkbox" class="position-filter" value="Middle"> middle</label>
          </div>
        </div>

        <!-- Players Grid -->
        <div id="playersGrid" class="row row-cols-4 g-4">
          <!-- Player cards inserted dynamically -->
        </div>
      </div>

      <!-- ========== PLAYER DETAIL COLUMN ========== -->
      <div class="col-md-3 offset-md-1">
        <div id="playerDetailCard" class="player-detail-card" style="display:none;">
          <h2 id="playerName" class="linda-title"></h2>
          <div class="d-flex justify-content-between align-items-start">
            <div id="playerInfo" class="linda-info"></div>
            <div class="linda-upload-box">
              <img src="../assets/icons/upload_arrow.png" style="width:30px;">
            </div>
          </div>
          <button class="view-stats-btn mt-4">view stats</button>

          <div class="featured-game-mini mt-4">
            <p class="mb-1">featured game:</p>
            <div id="featuredGame" class="game-tag"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================== JAVASCRIPT ================== i didn't know what folder to put in... -->
  <script>
    /*
      Manage Players Script
      --------------------
      - Fetches player data from /api/players/
      - Filters players by name and multiple positions
      - Displays a selected player's detailed info
    */

    const playersGrid = document.getElementById('playersGrid');
    const playerDetailCard = document.getElementById('playerDetailCard');
    const playerNameEl = document.getElementById('playerName');
    const playerInfoEl = document.getElementById('playerInfo');
    const featuredGameEl = document.getElementById('featuredGame');

    let playersData = [
      // Example static data (replace with API fetch)
      {name:'Linda', grade:12, position:'Middle, Left', featuredGame:'MHS VS LDH'},
      {name:'John', grade:11, position:'Right', featuredGame:'LDH VS MHS'},
      {name:'Alice', grade:10, position:'Setter', featuredGame:'MHS VS LDH'},
      {name:'Bob', grade:12, position:'Libero', featuredGame:'LDH VS MHS'},
      {name:'Eve', grade:11, position:'Middle', featuredGame:'MHS VS LDH'}
    ];

    // Initialize players grid
    displayPlayers(playersData);

    function displayPlayers(players) {
      playersGrid.innerHTML = '';
      if (players.length === 0) {
        playersGrid.innerHTML = '<p class="text-muted">No players match the filter.</p>';
        return;
      }

      players.forEach(player => {
        const col = document.createElement('div');
        col.className = 'col text-center';
        col.innerHTML = `
          <div class="player-square" style="cursor:pointer;"></div>
          <p class="m-0 fw-bold">${player.name}</p>
          <small>${player.position}</small>
        `;
        col.addEventListener('click', () => showPlayerDetail(player));
        playersGrid.appendChild(col);
      });
    }

    function showPlayerDetail(player) {
      playerDetailCard.style.display = 'block';
      playerNameEl.textContent = player.name.toUpperCase();
      playerInfoEl.innerHTML = `
        <p>player</p>
        <p>gr. ${player.grade}</p>
        <p class="mt-3"><strong>positions:</strong><br>${player.position}</p>
      `;
      featuredGameEl.textContent = player.featuredGame || 'N/A';
    }

    // Search input
    document.getElementById('searchInput').addEventListener('input', filterPlayers);

    // Position filters
    const checkboxes = document.querySelectorAll('.position-filter');
    checkboxes.forEach(cb => cb.addEventListener('change', filterPlayers));

    // Multi-position filter function
    function filterPlayers() {
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      const selectedPositions = Array.from(checkboxes)
                                     .filter(cb => cb.checked)
                                     .map(cb => cb.value);

      const filtered = playersData.filter(p => {
        const positions = p.position.split(',').map(pos => pos.trim());
        return p.name.toLowerCase().includes(searchText) &&
               positions.some(pos => selectedPositions.includes(pos));
      });
      displayPlayers(filtered);
    }
  </script>
</body>
</html>
